name: Publicar site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # histórico completo, para ordenar os produtos pela data em que foram postados

      - name: Gerar lista de produtos
        run: python3 ferramentas/gerar-lista.py

      - name: Separar arquivos do site
        run: |
          mkdir _site
          cp -r index.html style.css script.js loja.md produtos fotos _site/
          rm -f _site/produtos/_*.md

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
